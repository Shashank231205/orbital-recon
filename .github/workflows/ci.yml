name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # pyproject.toml declares requires-python >=3.10, but the Docker image
      # and the mypy/ruff targets are exercised on 3.11.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # CPU-only torch. The default PyPI wheel drags in the CUDA runtime --
      # several GB to download on every run, for a runner that has no GPU.
      # Installing it first means the editable install below finds torch and
      # torchvision already satisfied.
      - name: Install CPU torch
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.4.0" "torchvision>=0.19.0"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # testpaths = ["tests"] in pyproject.toml, so no path argument is needed.
      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
