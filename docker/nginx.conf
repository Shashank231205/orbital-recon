server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded scenes can reach max_upload_bytes (512 MiB in config.py). nginx
    # would otherwise reject them with a 413 before the request ever reaches
    # FastAPI, where the real limit and its error message live.
    client_max_body_size 512m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed asset filenames, so they can be cached
    # indefinitely; index.html must not be, or clients pin an old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Client-side routing: unknown paths are app routes, not 404s.
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # "backend" is the compose service name, resolved by Docker's embedded
        # DNS.
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GET /api/v1/jobs/{id}/stream is a server-sent event stream. With the
        # default buffering, nginx accumulates the response and flushes only
        # when its buffer fills or the upstream closes, so progress events
        # arrive in one batch at the end of the job instead of live. The
        # backend already sends X-Accel-Buffering: no, which nginx honours, but
        # setting it here too keeps the behaviour explicit and independent of
        # that header.
        proxy_buffering off;
        proxy_cache off;

        # SSE needs HTTP/1.1: HTTP/1.0 (nginx's proxy default) has no chunked
        # transfer encoding, so the stream could not be sent incrementally.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # A job can run for minutes between progress events while inference
        # works through tiles. The 60s default would drop the stream mid-job.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Uploads of large scenes are slow to write upstream; do not spool them
        # to disk first.
        proxy_request_buffering off;
    }
}
